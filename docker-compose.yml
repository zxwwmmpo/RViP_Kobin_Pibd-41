version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: vetclinic_db
    environment:
      POSTGRES_DB: vetclinic
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - vet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d vetclinic" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vetclinic_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vetclinic
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vet_network

networks:
  vet_network:
    driver: bridge