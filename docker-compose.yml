services:
  postgres:
    image: postgres:15
    container_name: vetclinic_db
    environment:
      POSTGRES_DB: vetclinic
      POSTGRES_USER: ${DB_USER:?user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?password}
    ports:
      - "5432:5432"
    networks:
      - vet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d vetclinic" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vetclinic
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?password}
      - EUREKA_URL=http://vetclinic-discovery:8761/eureka/
      - TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      - LOG_DIR=/logs
    volumes:
      - application_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      vetclinic-discovery:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/employees/report" ]
      interval: 1s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vet_network


  vetclinic-storage:
    build: ./vetclinic-storage
    environment:
      EUREKA_URL: http://vetclinic-discovery:8761/eureka/
      TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_DIR: /logs
      STORAGE_DIRECTORY: /data/reports
    volumes:
      - application_logs:/logs
      - report_files:/data/reports
    depends_on:
      vetclinic-discovery:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/actuator/health" ]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    networks:
      - vet_network

  vetclinic-discovery:
    build: ./vetclinic-discovery
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - vet_network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8761/" ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  vetclinic-report:
    build: ./vetclinic-report
    environment:
      - EUREKA_URL=http://vetclinic-discovery:8761/eureka/
      - TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      - LOG_DIR=/logs
    volumes:
      - application_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      vetclinic-discovery:
        condition: service_healthy
      app:
        condition: service_healthy
      jaeger:
        condition: service_started
      vetclinic-storage:
        condition: service_healthy
    networks:
      - vet_network


  vetclinic-gateway:
    build: ./vetclinic-gateway
    container_name: vetclinic_gateway
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://vetclinic-discovery:8761/eureka/
      TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_DIR: /logs
    volumes:
      - application_logs:/logs
    depends_on:
      app:
        condition: service_started
      vetclinic-report:
        condition: service_started
      vetclinic-discovery:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - vet_network

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    networks:
      - vet_network


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - vet_network

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - application_logs:/logs:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vet_network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vet_network


networks:
  vet_network:
    driver: bridge

volumes:
  application_logs:
  elasticsearch_data:
  logstash_data:
  report_files: