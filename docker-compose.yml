services:
  postgres:
    image: postgres:15
    container_name: vetclinic_db
    environment:
      POSTGRES_DB: vetclinic
      POSTGRES_USER: ${DB_USER:?user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?password}
    ports:
      - "5432:5432"
    networks:
      - vet_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d vetclinic" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vetclinic_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vetclinic
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?password}
      - LOG_DIR=/logs
      - INSTANCE_ID=employee-1
    volumes:
      - application_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/employees/report" ]
      interval: 1s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vet_network

  app-2:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vetclinic
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?password}
      LOG_DIR: /logs
      INSTANCE_ID: employee-2
    volumes:
      - application_logs:/logs
    depends_on:
      app:
        condition: service_healthy
    networks:
      - vet_network


  vetclinic-report:
    build: ./vetclinic-report
    container_name: vetclinic_report
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vetclinic
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Укажи DB_PASSWORD в .env}
      - LOG_DIR=/logs
      - INSTANCE_ID=report-1
    volumes:
      - application_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - vet_network

  vetclinic-report-2:
    build: ./vetclinic-report
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vetclinic
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?password}
      LOG_DIR: /logs
      INSTANCE_ID: report-2
    volumes:
      - application_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - vet_network


  vetclinic-gateway:
    build: ./vetclinic-gateway
    container_name: vetclinic_gateway
    ports:
      - "8082:8082"
    environment:
      EMPLOYEE_SERVICE_URL: http://app:8080
      REPORT_SERVICE_URL: http://vetclinic-report:8081
      LOG_DIR: /logs
    volumes:
      - application_logs:/logs
    depends_on:
      app:
        condition: service_started
      vetclinic-report:
        condition: service_started
    networks:
      - vet_network


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - vet_network

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - application_logs:/logs:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vet_network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - vet_network


networks:
  vet_network:
    driver: bridge

volumes:
  application_logs:
  elasticsearch_data:
  logstash_data:
