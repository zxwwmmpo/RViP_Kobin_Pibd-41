input {
  file {
    path => ["/logs/*.log"]
    mode => "tail"
    start_position => "beginning"

    sincedb_path => "/usr/share/logstash/data/vetclinic.sincedb"

    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    index => "vetclinic-logs-%{+YYYY.MM.dd}"

    ilm_enabled => false
    data_stream => false
  }
}