server:
  port: 8082

spring:
  application:
    name: vetclinic-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: employees
              uri: ${EMPLOYEE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/employees,/api/employees/**

            - id: reports
              uri: ${REPORT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/reports,/api/reports/**


logging:
  file:
    name: "${LOG_DIR:./logs}/${spring.application.name}.log"

  structured:
    format:
      file: ecs

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB