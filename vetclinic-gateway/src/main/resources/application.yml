server:
  port: 8082

spring:
  application:
    name: vetclinic-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: employees
              uri: lb://vetclinic-app
              predicates:
                - Path=/api/employees,/api/employees/**

            - id: reports
              uri: lb://vetclinic-report
              predicates:
                - Path=/api/reports,/api/reports/**

            - id: files
              uri: lb://vetclinic-storage
              predicates:
                - Path=/api/files,/api/files/**

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http


logging:
  file:
    name: "${LOG_DIR:./logs}/${spring.application.name}.log"

  structured:
    format:
      file: ecs

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB