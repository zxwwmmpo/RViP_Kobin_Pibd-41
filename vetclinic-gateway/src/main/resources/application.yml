server:
  port: 8082

spring:
  application:
    name: vetclinic-gateway

  cloud:
    discovery:
      client:
        simple:
          instances:
            employee:
              - uri: http://app:8080
              - uri: http://app-2:8080
            report:
              - uri: http://vetclinic-report:8081
              - uri: http://vetclinic-report-2:8081


    gateway:
      server:
        webmvc:
          routes:
            - id: employees
              uri: lb://employee
              predicates:
                - Path=/api/employees,/api/employees/**

            - id: reports
              uri: lb://report
              predicates:
                - Path=/api/reports,/api/reports/**


logging:
  file:
    name: "${LOG_DIR:./logs}/${spring.application.name}.log"

  structured:
    format:
      file: ecs

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./logs}/${spring.application.name}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB