server:
  port: 8081

spring:
  application:
    name: vetclinic-report

  config:
    import: "optional:file:../.env[.properties]"

  datasource:
    url: jdbc:postgresql://localhost:5432/vetclinic
    username: admin
    password: ${DB_PASSWORD:?password reports}

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  file:
    name: "${LOG_DIR:./logs}/${spring.application.name}-${INSTANCE_ID:local}.log"

  structured:
    format:
      file: ecs
    ecs:
      service:
        node-name: "${INSTANCE_ID:local}"

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./logs}/${spring.application.name}-${INSTANCE_ID:local}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB