server:
  port: 8081

spring:
  application:
    name: vetclinic-report

  config:
    import: "optional:file:../.env[.properties]"



employee-service:
  url: http://vetclinic-app

storage-service:
  url: http://vetclinic-storage


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:${random.uuid}}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http


logging:
  file:
    name: "${LOG_DIR:./logs}/${spring.application.name}-${HOSTNAME:local}.log"

  structured:
    format:
      file: ecs
    ecs:
      service:
        node-name: ${eureka.instance.instance-id}

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./logs}/${spring.application.name}-${HOSTNAME:local}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB