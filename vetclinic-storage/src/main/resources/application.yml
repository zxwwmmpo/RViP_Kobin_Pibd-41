server:
  port: 8083

spring:
  application:
    name: vetclinic-storage

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 21MB

storage:
  directory: ${STORAGE_DIRECTORY:./storage-data}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:${random.uuid}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

logging:
  file:
    name: "${LOG_DIR:./logs}/${spring.application.name}-${HOSTNAME:local}.log"

  structured:
    format:
      file: ecs
    ecs:
      service:
        node-name: ${eureka.instance.instance-id}

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_DIR:./logs}/${spring.application.name}-${HOSTNAME:local}.%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB